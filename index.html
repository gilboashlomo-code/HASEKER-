<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>הסקר של המדינה</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --indigo:#4f46e5;--indigo-light:#818cf8;--indigo-dark:#3730a3;
    --lime:#d4f542;--lime-dark:#a3e635;
    --cyan:#22d3ee;--purple:#c084fc;--yellow:#facc15;
    --bg:#0d0a2e;--card:#ffffff0f;--border:#ffffff18;
  }
  html,body{background:var(--bg);color:#fff;font-family:'Heebo',sans-serif;min-height:100vh}
  body{display:flex;justify-content:center}
  #app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
  .sc{animation:si .3s cubic-bezier(.22,1,.36,1) both}
  @keyframes si{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}

  .hdr{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:11px 16px 10px;background:rgba(13,10,46,0.92);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
  .hdr-logo{background:var(--indigo-dark);border:1px solid var(--indigo);border-radius:9px;padding:4px 9px;font-size:12px;font-weight:900;color:#c7d2fe}
  .hdr-live{display:flex;align-items:center;gap:5px;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.3);border-radius:99px;padding:3px 11px}
  .hdr-dot{width:7px;height:7px;background:#22c55e;border-radius:50%;animation:pu 1.4s infinite}
  @keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}
  .hdr-cnt{font-size:12px;font-weight:900;color:#86efac}
  .prog-wrap{height:3px;background:rgba(255,255,255,.08)}
  .prog-fill{height:100%;background:linear-gradient(to left,var(--yellow),var(--lime),var(--cyan));transition:width .45s ease}

  /* LANDING */
  .land{background:linear-gradient(160deg,#1a0f4f 0%,#0d0a2e 45%,#0a1535 100%);padding:20px 16px 24px;position:relative;overflow:hidden}
  .confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .cd{position:absolute;border-radius:2px;animation:cf linear infinite}
  @keyframes cf{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(900px) rotate(900deg);opacity:0}}
  .land-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .land-logo-box{background:#3730a3;border:1px solid #6366f1;border-radius:10px;padding:5px 11px;display:flex;align-items:center;gap:6px}
  .land-logo-txt{font-size:13px;font-weight:900;color:#c7d2fe}
  .land-logo-sub{font-size:10px;font-weight:700;color:#a5b4fc}
  .live-pill{display:flex;align-items:center;gap:5px;background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.3);border-radius:99px;padding:4px 11px}
  .live-pill-num{font-size:13px;font-weight:900;color:#86efac}
  .live-pill-lbl{font-size:9px;color:rgba(255,255,255,.45)}
  .land-headline{font-size:44px;font-weight:900;line-height:1.0;margin-bottom:12px}
  .land-headline .wh{color:#fff}
  .land-headline .yw{color:var(--lime)}
  .land-tagline{font-size:14px;color:rgba(255,255,255,.8);font-weight:700;margin-bottom:3px}
  .land-tagline2{font-size:13px;color:var(--lime);font-weight:900;margin-bottom:20px}
  .phone{background:linear-gradient(160deg,#1e1b4b,#0f0e2a);border:2px solid rgba(99,102,241,.5);border-radius:26px;padding:14px 13px;margin-bottom:18px}
  .phone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
  .live-badge{background:#ef4444;border-radius:6px;padding:2px 9px;font-size:11px;font-weight:900;display:flex;align-items:center;gap:4px}
  .live-badge-dot{width:6px;height:6px;background:#fff;border-radius:50%;animation:pu 1s infinite}
  .phone-pnum{font-size:19px;font-weight:900;color:#a5f3fc;line-height:1}
  .phone-plbl{font-size:9px;color:rgba(255,255,255,.4)}
  .pbar{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .pbar-name{font-size:11px;font-weight:700;width:82px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pbar-track{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
  .pbar-fill{height:100%;border-radius:99px}
  .pbar-num{font-size:11px;font-weight:900;width:22px;flex-shrink:0;color:rgba(255,255,255,.75)}
  .phone-footer{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
  .gauge-num{font-size:34px;font-weight:900;color:var(--lime-dark);line-height:1}
  .gauge-lbl{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
  .feats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}
  .feat{background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:13px;padding:10px 6px;text-align:center}
  .feat-icon{font-size:20px;margin-bottom:5px}
  .feat-main{font-size:11px;font-weight:900;color:rgba(255,255,255,.9);line-height:1.3}
  .feat-sub{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px}
  .cta{width:100%;padding:17px;border-radius:14px;background:var(--lime);color:#0f1a00;font-size:21px;font-weight:900;border:none;cursor:pointer;margin-bottom:13px;transition:transform .15s;letter-spacing:.2px;font-family:inherit}
  .cta:active{transform:scale(.98)}
  .social-proof{display:flex;align-items:center;justify-content:center;gap:9px;font-size:12px;color:rgba(255,255,255,.55);margin-bottom:20px}
  .avatars{display:flex}
  .av{width:25px;height:25px;border-radius:50%;border:2px solid var(--bg);margin-left:-7px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center}
  .prizes{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.28);border-radius:18px;padding:14px 13px;margin-bottom:18px}
  .prizes-title{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:900;color:#c7d2fe;margin-bottom:13px}
  .prizes-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .prize{background:rgba(0,0,0,.3);border:1px solid rgba(99,102,241,.22);border-radius:13px;padding:12px 8px;text-align:center}
  .prize-em{font-size:30px;margin-bottom:6px}
  .prize-name{font-size:12px;font-weight:900;color:#e0e7ff;margin-bottom:2px}
  .prize-place{font-size:10px;color:rgba(255,255,255,.4)}
  .how{margin-bottom:18px}
  .how-title{font-size:15px;font-weight:900;text-align:center;color:#e0e7ff;margin-bottom:14px}
  .how-row{display:flex;align-items:flex-start;gap:4px}
  .how-step{flex:1;text-align:center}
  .how-icon{width:50px;height:50px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;font-size:22px}
  .how-lbl{font-size:10px;font-weight:900;color:rgba(255,255,255,.85);line-height:1.4}
  .how-arr{font-size:16px;color:rgba(255,255,255,.25);margin-top:13px;flex-shrink:0}
  .trust{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:13px 15px}
  .trust-left{display:flex;align-items:center;gap:9px}
  .trust-txt{font-size:11px;line-height:1.55;color:rgba(255,255,255,.65)}
  .trust-right{text-align:left}
  .stars{color:#fbbf24;font-size:14px;letter-spacing:1px}
  .rating{font-size:19px;font-weight:900;color:#fbbf24;line-height:1}
  .rating-lbl{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px}

  /* OTHER SCREENS */
  .spage{padding:16px 16px 28px}
  .pill{display:inline-block;border-radius:99px;padding:4px 15px;font-size:11px;font-weight:900;margin-bottom:11px}
  .pill-g{background:var(--lime-dark);color:#0f2000}
  .pill-c{background:var(--cyan);color:#001a1f}
  .pill-y{background:var(--yellow);color:#1a1000}
  .pill-f{background:var(--purple);color:#1a0030}
  .sh2{font-size:26px;font-weight:900;line-height:1.2;margin-bottom:7px}
  .ssub{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:15px;line-height:1.6}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px 16px;margin-bottom:10px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .pcard{border-radius:14px;border:1px solid var(--border);background:var(--card);color:#fff;font-size:12px;font-weight:900;padding:13px 9px;min-height:64px;text-align:right;line-height:1.4;cursor:pointer;width:100%;transition:all .15s;font-family:inherit}
  .pcard:hover{background:rgba(255,255,255,.12)}
  .pcard.on{background:var(--yellow);border-color:var(--yellow);color:#1a1000}
  .flbl{font-size:11px;font-weight:900;color:rgba(255,255,255,.6);margin-bottom:7px;display:block;margin-top:13px}
  .flbl:first-child{margin-top:0}
  .chip{border-radius:99px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;font-size:12px;font-weight:900;padding:7px 13px;cursor:pointer;transition:all .15s;font-family:inherit}
  .chip.on{background:var(--lime-dark);border-color:var(--lime-dark);color:#0f2000}
  .gchip{border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.07);color:#fff;font-size:13px;font-weight:900;padding:11px;text-align:right;cursor:pointer;width:100%;transition:all .15s;font-family:inherit}
  .gchip.on{background:var(--lime-dark);border-color:var(--lime-dark);color:#0f2000}
  /* ── FIX: inputs are NOT re-rendered on every keystroke ── */
  .inp{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#fff;font-size:15px;padding:12px 13px;outline:none;margin-top:5px;font-family:inherit}
  .inp:focus{border-color:var(--lime-dark)}
  .fsel{width:100%;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:#080c1a;color:#fff;font-size:13px;padding:12px 13px;outline:none;appearance:none;margin-top:5px;font-family:inherit}
  .fsel:focus{border-color:var(--lime-dark)}
  .note{border-radius:11px;border:1px solid rgba(34,211,238,.15);background:rgba(34,211,238,.07);padding:9px 12px;font-size:11px;color:rgba(255,255,255,.6);line-height:1.6;margin:9px 0}
  .bnote{border-radius:11px;border:1px solid rgba(250,204,21,.2);background:rgba(250,204,21,.07);padding:9px 12px;font-size:11px;color:rgba(255,255,255,.7);line-height:1.6;margin-bottom:9px}
  .consent{display:flex;align-items:flex-start;gap:10px;background:rgba(0,0,0,.2);border-radius:12px;padding:12px;font-size:11px;line-height:1.75;color:rgba(255,255,255,.65);margin-top:11px;cursor:pointer}
  .consent input{margin-top:3px;accent-color:var(--lime-dark);width:16px;height:16px;flex-shrink:0}
  .bigicon{width:90px;height:90px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:44px;margin:10px auto 16px}
  .bi-g{background:linear-gradient(135deg,var(--lime-dark),var(--cyan))}
  .bi-l{background:rgba(163,230,53,.12);border:2px solid rgba(163,230,53,.3)}
  .rbar{margin-bottom:9px}
  .rbar-top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px}
  .rbar-track{height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
  .rbar-fill{height:100%;background:linear-gradient(to left,var(--lime-dark),var(--cyan));border-radius:99px}
  .btn-p{width:100%;padding:15px;border-radius:14px;background:linear-gradient(to left,var(--lime-dark),var(--cyan));color:#061000;font-size:17px;font-weight:900;border:none;cursor:pointer;margin-top:13px;font-family:inherit;transition:transform .15s}
  .btn-p:active{transform:scale(.98)}
  .btn-p:disabled{opacity:.35;cursor:not-allowed;background:rgba(255,255,255,.2);color:rgba(255,255,255,.4)}
  .btn-s{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:900;cursor:pointer;margin-top:9px;font-family:inherit;transition:transform .15s}
  .btn-s:active{transform:scale(.98)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var step = 0;
// State for non-input fields (re-rendered safely)
var S = {party:'', age:'', gender:'', city:'', agree:true, f1:'', f2:'', f3:'', prev:''};
// Separate state for text inputs - NOT touched by render()
var T = {id4:'', phone:''};

var PARTIES = ["הליכוד (נתניהו)","ביחד (בנט ולפיד)","ישר (איזנקוט)","עוצמה יהודית (בן גביר)","ש״ס (דרעי)","ישראל ביתנו (ליברמן)","הדמוקרטים (יאיר גולן)","יהדות התורה","רע״ם","חד״ש-תע״ל","הציונות הדתית (סמוטריץ׳)","לא החלטתי","לא אצביע"];
var FORECAST = ["הליכוד","ביחד","ישר","עוצמה יהודית","ש״ס","ישראל ביתנו","הדמוקרטים","יהדות התורה","רע״ם","חד״ש-תע״ל","הציונות הדתית","לא עוברת את אחוז החסימה"];
var PREV = ["הליכוד – 32 מנדטים","יש עתיד – 24 מנדטים","הציונות הדתית ועוצמה יהודית – 14 מנדטים","המחנה הממלכתי – 12 מנדטים","ש״ס – 11 מנדטים","יהדות התורה – 7 מנדטים","ישראל ביתנו – 6 מנדטים","רע״ם – 5 מנדטים","חד״ש-תע״ל – 5 מנדטים","מפלגת העבודה – 4 מנדטים","מרצ – לא עברה","בל״ד – לא עברה","לא הצבעתי"];
var AGES = ["18–24","25–34","35–44","45–59","60+"];
var GENDERS = ["גבר","אישה","אחר / מעדיף לא לציין"];
var CITIES = ["תל אביב-יפו","ירושלים","חיפה","ראשון לציון","פתח תקווה","אשדוד","נתניה","באר שבע","בני ברק","בת ים","רמת גן","אשקלון","רחובות","כפר סבא","הרצליה","חולון","מודיעין-מכבים-רעות","נס ציונה","לוד","רמלה","רעננה","הוד השרון","גבעתיים","נהריה","חדרה","עפולה","קריית אתא","אחר"];
var LIVE = [{n:"הליכוד",s:32,c:"#818cf8"},{n:"יש עתיד",s:17,c:"#22d3ee"},{n:"המחנה הממלכתי",s:13,c:"#a3e635"},{n:"ש״ס",s:9,c:"#fb923c"},{n:"יהדות התורה",s:7,c:"#c084fc"},{n:"ישראל ביתנו",s:6,c:"#60a5fa"},{n:"הציונות הדתית",s:6,c:"#4ade80"},{n:"חד״ש-תע״ל",s:5,c:"#f43f5e"},{n:"רע״ם",s:5,c:"#34d399"},{n:"מרצ",s:0,c:"#475569"}];
var R22 = [{n:"הליכוד",s:32},{n:"יש עתיד",s:24},{n:"הציונות הדתית",s:14},{n:"המחנה הממלכתי",s:12},{n:"ש״ס",s:11},{n:"יהדות התורה",s:7},{n:"ישראל ביתנו",s:6},{n:"רע״ם",s:5},{n:"חד״ש-תע״ל",s:5},{n:"העבודה",s:4},{n:"מרצ",s:0}];

function isOk() {
  return S.age && S.gender && S.city && /^\d{4}$/.test(T.id4) && T.phone.replace(/\D/g,'').length >= 9 && S.agree;
}

function card(i, e) { return '<div class="card"' + (e ? ' style="' + e + '"' : '') + '>' + i + '</div>'; }
function btnP(t, fn, dis) { return '<button class="btn-p"' + (dis ? ' disabled' : '') + ' onclick="' + fn + '">' + t + ' ›</button>'; }
function btnSec(t, fn) { return '<button class="btn-s" onclick="' + fn + '">' + t + '</button>'; }

function hdr() {
  if (step === 0) return '';
  var prog = Math.round(((Math.min(step, 6) + 1) / 7) * 100);
  return '<div class="hdr">'
    + '<div style="display:flex;align-items:center;gap:7px"><div class="hdr-logo">הסקר של המדינה ✓</div><span style="font-size:22px">🇮🇱</span></div>'
    + '<div style="display:flex;align-items:center;gap:8px">'
    + '<span style="font-size:11px;color:rgba(255,255,255,.45)">' + (Math.min(step, 6) + 1) + ' / 7</span>'
    + '<div class="hdr-live"><div class="hdr-dot"></div><span class="hdr-cnt">127,441</span></div>'
    + '</div></div>'
    + '<div class="prog-wrap"><div class="prog-fill" style="width:' + prog + '%"></div></div>';
}

function render() {
  var fns = [s0, s1, s2, s3, s4, s5, s6, s7];
  document.getElementById('app').innerHTML = hdr() + fns[step]();
  window.scrollTo(0, 0);
  // For details screen: bind input events WITHOUT re-rendering
  if (step === 2) bindDetailInputs();
  // For bonus screen: bind selects
  if (step === 5) bindBonusSelects();
}

// ── BIND TEXT INPUTS — update T only, no render() ──
function bindDetailInputs() {
  var id4el = document.getElementById('inp-id4');
  var phel = document.getElementById('inp-phone');
  var cbel = document.getElementById('inp-agree');
  if (id4el) {
    id4el.value = T.id4;
    id4el.addEventListener('input', function() {
      T.id4 = this.value.replace(/\D/g, '').slice(0, 4);
      this.value = T.id4;
      updateSubmitBtn();
    });
  }
  if (phel) {
    phel.value = T.phone;
    phel.addEventListener('input', function() {
      T.phone = this.value;
      updateSubmitBtn();
    });
  }
  if (cbel) {
    cbel.checked = S.agree;
    cbel.addEventListener('change', function() {
      S.agree = this.checked;
      updateSubmitBtn();
    });
  }
}

function updateSubmitBtn() {
  var btn = document.getElementById('submit-btn');
  if (btn) btn.disabled = !isOk();
}

function bindBonusSelects() {
  var keys = ['f1','f2','f3','prev'];
  keys.forEach(function(k) {
    var el = document.getElementById('sel-' + k);
    if (el) el.addEventListener('change', function() { S[k] = this.value; });
  });
}

/* ── S0 LANDING ── */
function s0() {
  var cols = ['#d4f542','#6366f1','#f97316','#22d3ee','#f43f5e','#a855f7','#fbbf24','#34d399'];
  var conf = '';
  for (var i = 0; i < 24; i++) {
    var l = Math.floor(Math.random() * 100), del = (Math.random() * 5).toFixed(2), dur = (3 + Math.random() * 5).toFixed(1);
    var w = Math.floor(4 + Math.random() * 8), h = Math.floor(8 + Math.random() * 16), c = cols[i % cols.length];
    conf += '<div class="cd" style="left:' + l + '%;width:' + w + 'px;height:' + h + 'px;background:' + c + ';animation-duration:' + dur + 's;animation-delay:' + del + 's;top:-30px"></div>';
  }
  var bars = LIVE.map(function(r) {
    return '<div class="pbar"><div class="pbar-name">' + r.n + '</div>'
      + '<div class="pbar-track"><div class="pbar-fill" style="width:' + Math.round(r.s * 2.9) + '%;background:' + r.c + '"></div></div>'
      + '<div class="pbar-num">' + r.s + '</div></div>';
  }).join('');

  return '<div class="land sc"><div class="confetti">' + conf + '</div><div style="position:relative;z-index:1">'
    + '<div class="land-topbar">'
      + '<div class="land-logo-box"><span class="land-logo-txt">הסקר</span><span class="land-logo-sub">של המדינה</span><span style="font-size:14px">✓</span></div>'
      + '<span style="font-size:30px">🇮🇱</span>'
      + '<div class="live-pill"><div class="hdr-dot"></div><span class="live-pill-num">2,311</span><span class="live-pill-lbl">עכשיו</span></div>'
    + '</div>'
    + '<div class="land-headline"><span class="wh">אם הבחירות</span><br><span class="wh">היו היום —</span><br><span class="yw">למי היית<br>מצביע?</span></div>'
    + '<div class="land-tagline">השתתפו במשחק התחזיות הגדול בישראל</div>'
    + '<div class="land-tagline2">וזכו בפרסים שנים!</div>'
    + '<div class="phone">'
      + '<div class="phone-head"><div class="live-badge"><div class="live-badge-dot"></div>LIVE</div><span style="font-size:12px;font-weight:900;color:#e0e7ff">תוצאות בזמן אמת</span><div><div class="phone-pnum">127,441</div><div class="phone-plbl">משתתפים</div></div></div>'
      + bars

    + '</div>'
    + '<div class="feats">'
      + '<div class="feat"><div class="feat-icon">🎁</div><div class="feat-main">מלא</div><div class="feat-sub">פרסים</div></div>'
      + '<div class="feat"><div class="feat-icon">⚡</div><div class="feat-main">3 דקות</div><div class="feat-sub">בלבד</div></div>'
      + '<div class="feat"><div class="feat-icon">🔒</div><div class="feat-main">100%</div><div class="feat-sub">אנונימי</div></div>'
      + '<div class="feat"><div class="feat-icon">✓</div><div class="feat-main">חינם</div><div class="feat-sub">לגמרי</div></div>'
    + '</div>'
    + '<button class="cta" onclick="go()">מתחילים עכשיו ›</button>'
    + '<div class="social-proof"><div class="avatars"><div class="av" style="background:#6366f1">א</div><div class="av" style="background:#f97316">מ</div><div class="av" style="background:#22d3ee">ד</div><div class="av" style="background:#a855f7">ר</div></div><span><strong style="color:#d4f542">127,441</strong> כבר השתתפו</span></div>'
    + '<div class="prizes"><div class="prizes-title">🏆 הפרסים שיחולקו</div><div class="prizes-grid">'
      + '<div class="prize"><div class="prize-em">📱</div><div class="prize-name">iPhone 15 Pro</div><div class="prize-place">מקום 1</div></div>'
      + '<div class="prize"><div class="prize-em">💻</div><div class="prize-name">MacBook Air</div><div class="prize-place">מקום 2</div></div>'
      + '<div class="prize"><div class="prize-em">✈️</div><div class="prize-name">חופשה זוגית</div><div class="prize-place">מקום 3</div></div>'
      + '<div class="prize"><div class="prize-em">💵</div><div class="prize-name">₪1,000 מזומן</div><div class="prize-place">מקומות 4–10</div></div>'
    + '</div></div>'
    + '<div class="how"><div class="how-title">איך זה עובד?</div><div class="how-row">'
      + '<div class="how-step"><div class="how-icon" style="background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.35)">📋</div><div class="how-lbl">עונים על שאלון קצר אנונימי</div></div>'
      + '<div class="how-arr">←</div>'
      + '<div class="how-step"><div class="how-icon" style="background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.3)">📊</div><div class="how-lbl">בוחרים תחזיות למנדטים</div></div>'
      + '<div class="how-arr">←</div>'
      + '<div class="how-step"><div class="how-icon" style="background:rgba(163,230,53,.14);border:1px solid rgba(163,230,53,.28)">🏆</div><div class="how-lbl">צוברים נקודות ומטפסים</div></div>'
      + '<div class="how-arr">←</div>'
      + '<div class="how-step"><div class="how-icon" style="background:rgba(250,204,21,.14);border:1px solid rgba(250,204,21,.28)">🎁</div><div class="how-lbl">זוכים בפרסים מטורפים!</div></div>'
    + '</div></div>'
    + '<div class="trust"><div class="trust-left"><span style="font-size:24px">🛡</span><div class="trust-txt"><strong style="color:#e0e7ff">המידע שלך בטוח איתנו!</strong><br>משתתפים נשארים אנונימיים לחלוטין</div></div><div class="trust-right"><div class="stars">★★★★★</div><div class="rating">4.9</div><div class="rating-lbl">דירוג המשתמשים</div></div></div>'

/* ── S1 PARTY ── */
function s1() {
  var cards = PARTIES.map(function(p, i) {
    return '<button class="pcard' + (S.party === p ? ' on' : '') + '" onclick="pickP(' + i + ')">' + p + '</button>';
  }).join('');
  return '<div class="spage sc"><span class="pill pill-g">שאלה ראשונה</span>'
    + '<div class="sh2">אם הבחירות היו היום — למי היית מצביע?</div>'
    + '<div class="ssub">בחירה אחת. המסך יעבור אוטומטית.</div>'
    + '<div class="pgrid">' + cards + '</div></div>';
}
function pickP(i) { S.party = PARTIES[i]; render(); setTimeout(go, 200); }

/* ── S2 DETAILS — inputs use IDs, bound after render ── */
function s2() {
  var ages = AGES.map(function(a) {
    return '<button class="chip' + (S.age === a ? ' on' : '') + '" onclick="ss(\'age\',\'' + a + '\')">' + a + '</button>';
  }).join('');
  var gens = GENDERS.map(function(g, i) {
    var safe = 'g' + i;
    return '<button class="gchip' + (S.gender === g ? ' on' : '') + '" onclick="ssGender(' + i + ')">' + g + '</button>';
  }).join('');
  var cOpts = '<option value="">בחר/י יישוב</option>' + CITIES.map(function(c) {
    return '<option value="' + c + '"' + (S.city === c ? ' selected' : '') + '>' + c + '</option>';
  }).join('');

  return '<div class="spage sc"><span class="pill pill-c">דיוק הסקר</span>'
    + '<div class="sh2">עוד כמה פרטים כלליים</div>'
    + '<div class="ssub">לצמצום כפילויות ולחיתוך דמוגרפי מדויק.</div>'
    + card(
        '<span class="flbl" style="margin-top:0">תחום גיל</span>'
        + '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px">' + ages + '</div>'
        + '<span class="flbl">מגדר</span>'
        + '<div style="display:grid;gap:7px;margin-bottom:13px">' + gens + '</div>'
        + '<span class="flbl">יישוב</span>'
        + '<select class="fsel" onchange="ss(\'city\',this.value)" style="margin-bottom:6px">' + cOpts + '</select>'
        + '<div class="note">נתוני הבסיס נועדו לצמצום כפילויות.</div>'
        + '<span class="flbl">4 ספרות אחרונות של תעודת זהות</span>'
        + '<input id="inp-id4" class="inp" type="text" inputmode="numeric" maxlength="4" placeholder="1 2 3 4" style="letter-spacing:.45em">'
        + '<span class="flbl">טלפון / WhatsApp</span>'
        + '<input id="inp-phone" class="inp" type="tel" placeholder="+972 5X-XXXXXXX">'
        + '<div style="font-size:11px;color:rgba(255,255,255,.35);margin-top:6px;line-height:1.5">לקבלת הודעה על זכייה ועדכונים ביום הבחירות.</div>'
        + '<label class="consent"><input id="inp-agree" type="checkbox"><span>אני מאשר/ת שאני מעל גיל 18, בעל/ת זכות בחירה בישראל, ומסכים/ה לקבל עדכונים.</span></label>'
      )
    + '<button id="submit-btn" class="btn-p" onclick="go()" disabled>הצטרפות חינם ›</button>'
    + '</div>';
}

function ssGender(i) { S.gender = GENDERS[i]; render(); }

/* ── S3 LOCATION ── */
function s3() {
  return '<div class="spage sc" style="text-align:center">'
    + '<div class="bigicon bi-l">📍</div>'
    + '<span class="pill pill-y">בונוס יום הבחירות</span>'
    + '<div class="sh2">קבל תחזיות אמת לפני כולם</div>'
    + '<div class="ssub" style="color:rgba(255,255,255,.75)">עדכונים ותוצאות בזמן אמת — לפני שהתקשורת מדווחת.</div>'
    + card('<div style="display:flex;align-items:center;gap:11px;text-align:right"><span style="font-size:28px">🎁</span><div><div style="font-size:15px;font-weight:900">100 נקודות בונוס</div><div style="font-size:11px;color:rgba(255,255,255,.45);margin-top:3px">אם תגיע להצביע ביום הבחירות</div></div></div>')
    + btnP('המשך וקבלת עדכונים', 'go()')
    + '</div>';
}

/* ── S4 SUCCESS — two distinct paths ── */
function s4() {
  return '<div class="spage sc" style="text-align:center">'
    + '<div class="bigicon bi-g">✓</div>'
    + '<div class="sh2">הצטרפת בהצלחה!</div>'
    + '<div style="font-size:19px;font-weight:900;color:#a3e635;margin-bottom:15px">הסקר של המדינה 🇮🇱</div>'
    + card('<div style="display:flex;align-items:center;gap:11px;text-align:right"><span style="font-size:28px">⭐</span><div><div style="font-size:15px;font-weight:900">בונוס נקודות מחכה לך</div><div style="font-size:11px;color:rgba(255,255,255,.5);margin-top:3px">ענה על שאלות תחזית וצבור עד 100 נקודות</div></div></div>')
    + '<button class="btn-p" onclick="goToBonus()" style="margin-top:13px">להוסיף בונוס נקודות ›</button>'
    + '<button class="btn-s" onclick="goToResults()">דלג לתוצאות</button>'
    + '</div>';
}
// ── FIX: bonus → step 5, skip → step 6 ──
function goToBonus()   { step = 5; render(); }
function goToResults() { step = 6; render(); }

/* ── S5 BONUS — selects bound after render ── */
function s5() {
  function selHTML(val, opts, id, lbl) {
    var os = opts.map(function(o) { return '<option value="' + o + '"' + (val === o ? ' selected' : '') + '>' + o + '</option>'; }).join('');
    return '<span class="flbl">' + lbl + '</span><select id="sel-' + id + '" class="fsel"><option value="">בחר/י</option>' + os + '</select>';
  }
  return '<div class="spage sc"><span class="pill pill-f">שלב בונוס</span>'
    + '<div class="sh2">משחק התחזיות הגדול בישראל</div>'
    + '<div class="ssub">לא חובה. ענה על הכל וצבור 30 נקודות נוספות.</div>'
    + card('<div class="bnote">ראשונה: 100 נק׳ &nbsp;·&nbsp; שנייה: 70 נק׳ &nbsp;·&nbsp; שלישית: 50 נק׳ &nbsp;·&nbsp; אחרת: 10 נק׳</div>'
      + selHTML(S.f1, FORECAST, 'f1', 'מי תהיה המפלגה הגדולה?')
      + selHTML(S.f2, FORECAST, 'f2', 'מי תהיה המפלגה השנייה?')
      + selHTML(S.f3, FORECAST, 'f3', 'מי תהיה המפלגה השלישית?')
      + selHTML(S.prev, PREV, 'prev', 'למי הצבעת בבחירות 2022?'))
    + btnP('המשך', 'go()')
    + '</div>';
}

/* ── S6 RESULTS ── */
function s6() {
  var bars = R22.map(function(r) {
    return '<div class="rbar"><div class="rbar-top"><span>' + r.n + '</span><span>' + r.s + '</span></div>'
      + '<div class="rbar-track"><div class="rbar-fill" style="width:' + Math.max(r.s > 0 ? 5 : 0, r.s * 3) + '%"></div></div></div>';
  }).join('');
  return '<div class="spage sc"><span class="pill pill-g">השוואה היסטורית</span>'
    + '<div class="sh2">תוצאות הבחירות הקודמות</div>'
    + '<div class="ssub">כנסת ה-25 — נובמבר 2022.</div>'
    + card('<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:13px;font-weight:900;color:#a3e635">📊 תוצאות 2022</span><div style="text-align:left"><div style="font-size:22px;font-weight:900">120</div><div style="font-size:10px;color:rgba(255,255,255,.4)">מנדטים</div></div></div>' + bars
      + '<div style="background:rgba(0,0,0,.2);border-radius:11px;padding:10px;font-size:11px;color:rgba(255,255,255,.5);margin-top:9px;line-height:1.5">מרצ ואחרות שלא עברו את אחוז החסימה מוצגות עם 0 מנדטים.</div>')
    + btnP('סיום', 'go()')
    + '</div>';
}

/* ── S7 FINAL ── */
function s7() {
  return '<div class="spage sc" style="text-align:center">'
    + '<div class="bigicon bi-g">🏆</div>'
    + '<div class="sh2">הדמו הושלם בהצלחה!</div>'
    + '<div style="font-size:14px;color:rgba(255,255,255,.6);margin-bottom:18px;line-height:1.7">עברת את כל השלבים.</div>'
    + card('<div style="text-align:right"><div style="font-size:12px;font-weight:900;color:#a3e635;margin-bottom:9px">סיכום הנתונים</div>'
      + '<table style="width:100%;font-size:12px;line-height:2.1;border-collapse:collapse">'
      + '<tr><td style="color:rgba(255,255,255,.5);width:42%">מפלגה</td><td style="font-weight:900">' + (S.party || '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">גיל</td><td style="font-weight:900">' + (S.age || '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">מגדר</td><td style="font-weight:900">' + (S.gender || '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">עיר</td><td style="font-weight:900">' + (S.city || '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">ת.ז. (4 ספרות)</td><td style="font-weight:900">' + (T.id4 ? '****' + T.id4 : '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">טלפון</td><td style="font-weight:900">' + (T.phone || '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">תחזית 1</td><td style="font-weight:900">' + (S.f1 || '—') + '</td></tr>'
      + '<tr><td style="color:rgba(255,255,255,.5)">הצבעה קודמת</td><td style="font-weight:900">' + (S.prev || '—') + '</td></tr>'
      + '</table></div>')
    + '<button class="btn-p" onclick="rst()" style="margin-top:13px">התחל מחדש ›</button>'
    + '</div>';
}

function go()  { step = Math.min(7, step + 1); render(); }
function rst() { step = 0; S = {party:'',age:'',gender:'',city:'',agree:true,f1:'',f2:'',f3:'',prev:''}; T = {id4:'',phone:''}; render(); }
function ss(k, v) { S[k] = v; render(); }

render();
</script>
